name: Montar ISO SlotOS
on: workflow_dispatch
jobs:
  iso:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Montar ISO
        run: |
          mkdir -p saida
          docker run --rm --privileged -v "$PWD:/kit" -v "$PWD/saida:/out" alpine:latest sh /kit/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: slotos-iso
          path: saida/*.iso
